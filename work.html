<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>Work — Lolazy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap');
:root{--bg:#080808;--fg:#f2f0eb;--muted:#92908c;--red:#ff3038;--line:#33312f;--font-sans:'Inter','Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-weight:400;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.noise{position:fixed;inset:0;pointer-events:none;z-index:20;opacity:.07;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E")}
.topbar{height:72px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font:400 11px var(--font-sans);letter-spacing:.1em;position:relative;z-index:30;background:#080808d9;backdrop-filter:blur(12px)}
.brand{font-weight:500;letter-spacing:.08em}.brand span{color:var(--red)}
.nav{display:flex;gap:clamp(14px,3vw,34px);color:#b7b4ae}.nav a{transition:color .2s}.nav a:hover,.nav a.active{color:var(--red)}
.location{color:#777;font:400 10px var(--font-sans)}
footer{display:flex;justify-content:space-between;padding:20px 5vw;border-top:1px solid var(--line);font:400 10px var(--font-sans);color:#777;letter-spacing:.08em;gap:20px}
@media(max-width:650px){.topbar{height:64px;padding:0 5vw}.nav{gap:11px}.nav a{font-size:10px}.location{display:none}footer{padding:18px 5vw;flex-wrap:wrap}}

.work-main{padding:clamp(48px,7vw,96px) 5vw 110px;max-width:1700px;margin:auto}
.category-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;align-items:start}
.category-card{min-width:0;display:block}
.card-art{background:#080808;position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;max-width:100%}

.card-bg{position:relative;width:auto;max-width:100%;height:auto;object-fit:contain;display:block;z-index:1;opacity:.82;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .4s}
.category-card:hover .card-bg{transform:scale(1.018);opacity:1}
.card-word{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;font:300 clamp(1.1rem,2.2vw,2.4rem) var(--font-sans);letter-spacing:.02em;text-align:center;padding:12px;color:#f4f0ea;text-shadow:0 0 24px rgba(0,0,0,.65);overflow-wrap:anywhere;pointer-events:none}

.custom-cursor{display:none}
@media(hover:hover) and (pointer:fine){
  body,a,img{cursor:none!important}
  .custom-cursor{display:block;position:fixed;top:0;left:0;width:92px;pointer-events:none;z-index:9999;opacity:0;transform:translate3d(-50%,-50%,0);transition:opacity .25s ease}
  .custom-cursor.is-visible{opacity:1}
  .custom-cursor img{width:100%;height:auto;display:block;filter:drop-shadow(0 0 8px rgba(255,48,56,.45));transition:filter .25s ease,opacity .25s ease}
  .custom-cursor.is-dark img{filter:brightness(0);opacity:.75}
}

@media(max-width:600px){.work-main{padding:48px 6vw 80px}.category-grid{grid-template-columns:1fr;gap:18px}}
</style></head><body><div class="noise"></div>
<div class="custom-cursor" id="lolazyCursor"><img src="images/lolazy-logo.png" alt=""></div>
<header class="topbar"><a class="brand" href="index.html">LOLAZY<span>®</span></a><nav class="nav"><a class="active" href="work.html#work">WORK</a><a href="#portfolio">PORTFOLIO</a><a href="about.html#about">ABOUT</a><a href="about.html#contact">CONTACT</a></nav><span class="location">TW / 2026</span></header>
<main class="work-main" id="work">
<div class="category-grid" id="portfolio">
  <a class="category-card" href="graphic-design.html" aria-label="graphic design">
    <div class="card-art">
      <img class="card-bg" src="thumb-01.webp" alt="graphic design">
      <span class="card-word">graphic design</span>
    </div>
  </a>
  <a class="category-card" href="#" aria-label="fashion photography">
    <div class="card-art">
      <img class="card-bg" src="post01.png" alt="fashion photography">
      <span class="card-word">fashion photography</span>
    </div>
  </a>
  <a class="category-card" href="#" aria-label="zine">
    <div class="card-art">
      <img class="card-bg" src="PEI06912-7.jpg" alt="zine">
      <span class="card-word">zine</span>
    </div>
  </a>
  <a class="category-card" href="#" aria-label="film">
    <div class="card-art">
      <img class="card-bg" src="strangeFestival2-1.jpg" alt="film">
      <span class="card-word">film</span>
    </div>
  </a>
  <a class="category-card" href="#" aria-label="art photography">
    <div class="card-art">
      <img class="card-bg" src="PEI05538.jpg" alt="art photography">
      <span class="card-word">art photography</span>
    </div>
  </a>
  <a class="category-card" href="#" aria-label="studio">
    <div class="card-art">
      <img class="card-bg" src="PEI03867.jpg" alt="studio">
      <span class="card-word">studio</span>
    </div>
  </a>
  <a class="category-card" href="#" aria-label="exhibition">
    <div class="card-art">
      <img class="card-bg" src="IMG_4797.HEIC" alt="exhibition">
      <span class="card-word">exhibition</span>
    </div>
  </a>
</div>
</main>
<footer><span>© 2026 LOLAZY — ALL RIGHTS RESERVED</span><span>WORK / PORTFOLIO</span></footer>
<script>
(()=>{const c=document.getElementById('lolazyCursor');if(!c)return;window.addEventListener('mousemove',e=>{c.style.transform=`translate3d(${e.clientX}px,${e.clientY}px,0) translate(-50%,-50%)`;c.classList.add('is-visible')},{passive:true});document.addEventListener('mouseleave',()=>c.classList.remove('is-visible'));document.querySelectorAll('.card-art').forEach(el=>{el.addEventListener('mouseenter',()=>c.classList.add('is-dark'));el.addEventListener('mouseleave',()=>c.classList.remove('is-dark'))})})();
</script></body></html>
